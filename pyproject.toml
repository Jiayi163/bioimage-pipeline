[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioimage-pipeline"
version = "0.1.0"
description = "A lightweight bioimage analysis framework inspired by Fiji and CellProfiler."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Bioimage Pipeline Contributors" }
]
dependencies = [
    "numpy",
    "tifffile",
    "scikit-image",
    "scipy",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]
qc = [
    "napari>=0.5"
]

[tool.setuptools.packages.find]
include = ["bioimage_pipeline*"]
